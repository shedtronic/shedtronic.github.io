<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080807">
    <title>drone-looper</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/horse-skull.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css?v=23">
  </head>
  <body>
    <main class="shell" aria-label="Two drone creator looper">
      <section class="drone drone-a" data-drone="0">
        <canvas class="scope" aria-hidden="true"></canvas>
        <div class="drone-topline">
          <div>
            <p class="eyebrow">Drone A</p>
            <h1 id="name-a">LOW ORGANISM</h1>
            <button class="wave-btn" aria-label="Cycle Drone A wave type">Tri</button>
          </div>
          <div class="mode" role="group" aria-label="Drone A mode">
            <button class="mode-btn is-active" data-mode="synth">Synth</button>
            <button class="mode-btn" data-mode="sample">Sample</button>
            <button class="mode-btn" data-mode="hybrid">Hybrid</button>
          </div>
        </div>

        <div class="pad" role="application" aria-label="Drone A thumb pad">
          <div class="pad-crosshair"></div>
          <div class="pad-cursor"></div>
          <span class="axis x">pitch / throat</span>
          <span class="axis y">pressure / rot</span>
        </div>

        <div class="controls">
          <label>Pitch <input type="range" class="pitch" min="-36" max="12" value="-12" step="1"></label>
          <label>Fine <input type="range" class="fine" min="-50" max="50" value="0" step="1"></label>
          <label>Drift <input type="range" class="drift" min="0" max="100" value="14" step="1"></label>
          <label>Decay <input type="range" class="decay" min="0" max="98" value="72" step="1"></label>
        </div>

        <div class="commands">
          <button class="icon-btn power is-on" aria-label="Toggle Drone A">●</button>
          <button class="icon-btn snap" aria-label="Snap Drone A pitch pad">Snap</button>
          <button class="icon-btn freeze" aria-label="Hold Drone A pad">Hold</button>
          <button class="icon-btn capture" aria-label="Toggle Drone A feedback trail">Feedback</button>
          <button class="icon-btn mutate" aria-label="Mutate Drone A">Mutate</button>
        </div>

        <div class="sample-row">
          <select class="sample-select" aria-label="Drone A sample">
            <option value="">No sample loaded</option>
          </select>
        </div>
      </section>

      <section class="spine">
        <button id="start-audio" aria-pressed="false">Audio Off</button>
        <label class="bank-loader">
          <input id="sample-import" type="file" accept=".mp3,.wav,.ogg,.flac,.m4a,.aac,audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/mp4,audio/aac">
          Import Audio
        </label>
        <div class="bank-meter">
          <span id="bank-count">No audio loaded</span>
          <span id="bank-size">MP3 WAV OGG FLAC M4A / v23</span>
        </div>
        <audio id="native-audio" controls></audio>
        <button id="test-sample">Test Loop</button>
        <button id="play-sample" disabled>Sample Loop</button>
        <label class="snap-grid-control">Grid
          <select id="snap-grid" aria-label="Pitch snap grid">
            <option value="1">Semitone</option>
            <option value="5">Fourth</option>
            <option value="7" selected>Fifth</option>
            <option value="12">Octave</option>
          </select>
        </label>
        <input id="master" type="range" min="0" max="100" value="72" aria-label="Master volume">
      </section>

      <section class="drone drone-b" data-drone="1">
        <canvas class="scope" aria-hidden="true"></canvas>
        <div class="drone-topline">
          <div>
            <p class="eyebrow">Drone B</p>
            <h2 id="name-b">ODD WEIGHT</h2>
            <button class="wave-btn" aria-label="Cycle Drone B wave type">Pulse</button>
          </div>
          <div class="mode" role="group" aria-label="Drone B mode">
            <button class="mode-btn is-active" data-mode="synth">Synth</button>
            <button class="mode-btn" data-mode="sample">Sample</button>
            <button class="mode-btn" data-mode="hybrid">Hybrid</button>
          </div>
        </div>

        <div class="pad" role="application" aria-label="Drone B thumb pad">
          <div class="pad-crosshair"></div>
          <div class="pad-cursor"></div>
          <span class="axis x">pitch / throat</span>
          <span class="axis y">pressure / tear</span>
        </div>

        <div class="controls">
          <label>Pitch <input type="range" class="pitch" min="-36" max="12" value="-7" step="1"></label>
          <label>Fine <input type="range" class="fine" min="-50" max="50" value="-8" step="1"></label>
          <label>Drift <input type="range" class="drift" min="0" max="100" value="18" step="1"></label>
          <label>Decay <input type="range" class="decay" min="0" max="98" value="68" step="1"></label>
        </div>

        <div class="commands">
          <button class="icon-btn power is-on" aria-label="Toggle Drone B">●</button>
          <button class="icon-btn snap" aria-label="Snap Drone B pitch pad">Snap</button>
          <button class="icon-btn freeze" aria-label="Hold Drone B pad">Hold</button>
          <button class="icon-btn capture" aria-label="Toggle Drone B feedback trail">Feedback</button>
          <button class="icon-btn mutate" aria-label="Mutate Drone B">Mutate</button>
        </div>

        <div class="sample-row">
          <select class="sample-select" aria-label="Drone B sample">
            <option value="">No sample loaded</option>
          </select>
        </div>
      </section>
    </main>

    <template id="status-template">
      <p class="toast"></p>
    </template>
    <script src="app.js?v=23" type="module"></script>
  </body>
</html>
